# ⛔ THIS IS NOT THE PRODUCTION CONFIG. DO NOT USE IT TO REASON ABOUT LIVE nginx. ⛔
#
# jagoakademi.com is served by HOST-level nginx (systemd, outside Docker) which
# terminates TLS and proxies to published container ports 127.0.0.1:3010 (web) and
# 127.0.0.1:4010 (api). The authoritative files are:
#   • deploy/jagoakademi.com.nginx  — the host vhost template kept in this repo
#   • /etc/nginx/ on the host       — what is actually running (check: nginx -T)
#
# This file describes the OLD fully-containerized topology (nginx AS a container,
# upstreams web:3000 / api:4000 over compose DNS). It is mounted only by
# docker-compose.prod.yml, which is itself banner-marked DO NOT USE ON THE LIVE VPS
# (BL-43 — running it caused a 28-minute sitewide 502 on 17 Jul 2026).
#
# It also still contains a 443 server block for `server_name api.jagoakademi.com`,
# a host that does NOT resolve (NXDOMAIN, BL-33) and never did. Reading this file
# as if it were live is how people conclude the API lives on its own subdomain — it
# does not; the API is reached at https://jagoakademi.com/api/*.
#
# Kept as reference for a future fully-containerized setup. Nothing here is live.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_vary on;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstream services
    upstream web {
        server web:3000;
    }

    upstream api {
        server api:4000;
    }

    # HTTP → HTTPS redirect (+ ACME webroot so certbot can renew without downtime)
    server {
        listen 80;
        server_name jagoakademi.com www.jagoakademi.com api.jagoakademi.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API server
    server {
        listen 443 ssl http2;
        server_name api.jagoakademi.com;

        ssl_certificate /etc/letsencrypt/live/jagoakademi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jagoakademi.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

        # File upload limit
        client_max_body_size 100M;

        # Auth rate limiting
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API
        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # Web app
    server {
        listen 443 ssl http2;
        server_name jagoakademi.com www.jagoakademi.com;

        ssl_certificate /etc/letsencrypt/live/jagoakademi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jagoakademi.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

        # Immutable static files (Next.js _next/static)
        location /_next/static/ {
            proxy_pass http://web;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js app
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
